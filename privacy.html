<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informativa privacy — Tennis Club Mendrisio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script>if(localStorage.getItem("sportos-tema")==="light")document.documentElement.setAttribute("data-theme","light");</script>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1f30">
<style>
  .privacy-testo { color: var(--chalk-grey); font-size: 0.85rem; line-height: 1.7; }
  .privacy-testo h2 { font-size: 0.95rem; color: var(--line-white); margin: 22px 0 8px; }
  .privacy-testo h2:first-child { margin-top: 0; }
  .privacy-testo p { margin: 0 0 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div>
      <div class="topbar-kicker" id="centro-kicker">Tennis Club Mendrisio</div>
      <h1>Informativa privacy</h1>
    </div>
    <div></div>
    <button type="button" class="topbar-link" id="theme-toggle-btn">Tema chiaro</button>
  </div>

  <main>
    <div class="privacy-testo" id="privacy-testo">
      <div class="empty-state"><div class="display">Caricamento…</div></div>
    </div>
  </main>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script>
  // Testo gestito da Configurazione → Impostazioni generali → "Informativa
  // privacy" (IMPOSTAZIONI.privacyTesto, impostazioni/generale, lettura
  // pubblica) — non più scritto qui a mano. Un blocco separato da una riga
  // vuota diventa un titolo (<h2>) se è una sola riga breve, altrimenti un
  // paragrafo — così un testo semplice basta a strutturare la pagina senza
  // dover scrivere HTML in Configurazione.
  function renderPrivacyTesto(testo) {
    const blocchi = (testo || "").split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
    if (blocchi.length === 0) return `<p>Informativa non ancora disponibile — contatta la segreteria del circolo.</p>`;
    return blocchi.map(b => {
      const titolo = !b.includes("\n") && b.length <= 80;
      return titolo ? `<h2>${escapeHtml(b)}</h2>` : `<p>${escapeHtml(b)}</p>`;
    }).join("");
  }

  (async function () {
    await loadDatiCentro();
    document.getElementById("centro-kicker").textContent = DATI_CENTRO.nome;
    await loadImpostazioni();
    document.getElementById("privacy-testo").innerHTML = renderPrivacyTesto(IMPOSTAZIONI.privacyTesto);
  })();
</script>
</body>
</html>
