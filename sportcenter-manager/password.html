<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cambia password — Sport-OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <div class="topbar">
    <h1>Password</h1>
    <div class="topbar-account">
      <div class="user-chip" id="user-chip">—</div>
      <a href="password.html" class="topbar-link">Password</a>
    </div>
  </div>

  <main>

    <div class="section-title"><h2>Cambia password</h2></div>
    <p style="color:var(--chalk-grey);font-size:0.82rem;margin:-6px 0 14px;">Per motivi di sicurezza devi confermare la password attuale.</p>

    <form id="change-password-form">
      <div class="field">
        <label for="current-password">Password attuale</label>
        <input type="password" id="current-password" required autocomplete="current-password">
      </div>
      <div class="field">
        <label for="new-password">Nuova password</label>
        <input type="password" id="new-password" required minlength="6" autocomplete="new-password" placeholder="almeno 6 caratteri">
      </div>
      <div class="field">
        <label for="confirm-password">Conferma nuova password</label>
        <input type="password" id="confirm-password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="error-msg" id="password-error"></div>
      <div id="password-success" class="hidden" style="color:var(--ball);font-size:0.85rem;margin:-6px 0 14px;">Password aggiornata con successo.</div>
      <button type="submit" class="btn btn-primary" id="change-password-btn">Aggiorna password</button>
    </form>

  </main>

  <nav class="bottom-nav">
    <a href="diario.html">Diario</a>
    <a href="resoconto.html">Resoconto</a>
    <a href="#" title="In arrivo">Corsi</a>
    <a href="#" title="In arrivo">Prenotazioni</a>
    <a href="#" title="In arrivo">Camp</a>
    <a href="utenti.html">Team</a>
    <a href="configurazione.html">Config</a>
    <a href="#" id="logout-link">Esci</a>
  </nav>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/password.js"></script>
</body>
</html>
