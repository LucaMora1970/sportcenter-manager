<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prenota il campo padel — Tennis Club Mendrisio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script>if(localStorage.getItem("sportos-tema")==="light")document.documentElement.setAttribute("data-theme","light");</script>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1f30">
</head>
<body>
<div class="app">

  <div class="topbar">
    <div>
      <div class="topbar-kicker" id="centro-kicker">Tennis Club Mendrisio</div>
      <h1>Prenota il campo padel</h1>
    </div>
    <div></div>
    <button type="button" class="topbar-link" id="theme-toggle-btn">Tema chiaro</button>
  </div>

  <main>

    <p style="color:var(--chalk-grey);font-size:0.8rem;margin:-4px 0 16px;">Nessuna registrazione richiesta — scegli l'orario, paga online, ricevi subito il biglietto con il codice per l'accesso al campo.</p>

    <div class="day-strip" id="dayStrip" role="tablist" aria-label="Giorno"></div>

    <div class="duration-row" style="margin-top:16px;">
      <div>
        <div class="picker-label" style="margin-bottom:10px;">1. Scegli la durata</div>
        <div class="seg" id="durationSeg" role="group" aria-label="Durata prenotazione">
          <button type="button" data-dur="60" aria-pressed="false">60'</button>
          <button type="button" data-dur="90" aria-pressed="false">90'</button>
        </div>
      </div>
      <div class="tabellone-legend">
        <span><i class="i-occ"></i>Occupato</span>
        <span><i class="i-free"></i>Libero</span>
        <span><i class="i-slot"></i>Disponibile</span>
      </div>
    </div>

    <hr class="court-divider">

    <div>
      <div class="court-head" style="margin-bottom:8px;">
        <h2>Campo Padel</h2>
        <span class="tag">unico campo</span>
      </div>
      <div class="picker-label" style="margin-bottom:8px;">2. Tocca dove posizionarti</div>
      <div class="error-msg" id="tabellone-error"></div>
      <div class="timeline" id="timeline"></div>
    </div>

  </main>

</div>

<div class="summary-bar" id="summaryBar">
  <div class="summary-card" style="flex-direction:column;align-items:stretch;gap:10px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <div class="summary-info">
        <div class="t" id="summaryTitle">—</div>
        <div class="p" id="summaryPrice"></div>
      </div>
      <button type="button" class="summary-cta" id="summaryCta" style="width:auto;">Paga e prenota</button>
    </div>
    <div class="field" style="margin-bottom:0;">
      <input type="text" id="credito-input" placeholder="Hai un codice credito? (facoltativo) es. CR-XXXX-XXXX">
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/prenota-padel.js"></script>
</body>
</html>
