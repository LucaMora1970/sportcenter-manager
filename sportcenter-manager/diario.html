<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario giornaliero — sportcenter-manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <div class="topbar">
    <h1>Diario</h1>
    <div class="user-chip" id="user-chip">—</div>
  </div>

  <main>

    <!-- Scoreboard: totale ore di oggi, elemento firma della pagina -->
    <div class="scoreboard">
      <div>
        <div class="label">Ore registrate oggi</div>
        <div class="value" id="today-total">0.0<small>h</small></div>
      </div>
      <div id="admin-hint" class="badge hidden" style="margin-bottom:6px;">Vista personale</div>
    </div>

    <!-- Form nuova voce -->
    <div class="section-title"><h2>Nuova voce</h2></div>
    <form id="entry-form">
      <div class="row2">
        <div class="field">
          <label for="data">Data</label>
          <input type="date" id="data" required>
        </div>
        <div class="field">
          <label for="disciplina">Disciplina</label>
          <select id="disciplina" required></select>
        </div>
      </div>

      <div class="field">
        <label for="tipoAttivita">Tipo attività</label>
        <select id="tipoAttivita" required></select>
      </div>

      <div class="row2">
        <div class="field">
          <label for="oraInizio">Ora inizio</label>
          <input type="time" id="oraInizio" required>
        </div>
        <div class="field">
          <label for="oraFine">Ora fine</label>
          <input type="time" id="oraFine" required>
        </div>
      </div>

      <div class="field">
        <label for="note">Note (opzionale)</label>
        <input type="text" id="note" placeholder="es. nome allievo, campo, dettagli">
      </div>

      <button type="submit" class="btn btn-primary" id="save-btn">Salva voce</button>
    </form>

    <hr class="court-divider">

    <div class="section-title"><h2>Attività di oggi</h2></div>
    <div id="entries-list">
      <div class="empty-state">
        <div class="display">Caricamento…</div>
      </div>
    </div>

  </main>

  <nav class="bottom-nav">
    <a href="diario.html" class="active">Diario</a>
    <a href="#" title="In arrivo">Corsi</a>
    <a href="#" title="In arrivo">Prenotazioni</a>
    <a href="#" title="In arrivo">Camp</a>
    <a href="#" id="logout-link">Esci</a>
  </nav>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/diario.js"></script>
</body>
</html>
