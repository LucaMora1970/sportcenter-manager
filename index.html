<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sport-OS — Accedi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script>if(localStorage.getItem("sportos-tema")==="light")document.documentElement.setAttribute("data-theme","light");</script>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1f30">
</head>
<body>
<div class="app">
  <div style="display:flex;justify-content:flex-end;padding:16px 16px 0;">
    <button type="button" class="topbar-link" id="theme-toggle-btn">Tema chiaro</button>
  </div>
  <div class="login-wrap">
    <div class="login-hero">
      <div class="display">Sport-OS</div>
      <div class="tag">TC MENDRISIO</div>
    </div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" placeholder="nome.cognome@circolo.ch">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <div class="error-msg" id="error-msg"></div>
      <button type="submit" class="btn btn-primary" id="login-btn">Accedi</button>
      <button type="button" class="btn btn-ghost" id="forgot-password-btn" style="margin-top:10px;width:100%;">Password dimenticata?</button>
    </form>

    <form id="reset-form" class="hidden">
      <div class="field">
        <label for="reset-email">Email</label>
        <input type="email" id="reset-email" required placeholder="nome.cognome@circolo.ch">
      </div>
      <div class="error-msg" id="reset-error"></div>
      <button type="submit" class="btn btn-primary" id="reset-btn">Invia link di reset</button>
      <button type="button" class="btn btn-ghost" id="reset-back-btn" style="margin-top:10px;width:100%;">Torna al login</button>
    </form>

    <div id="reset-inviato" class="hidden empty-state">
      <div class="display">Controlla la posta</div>
      <p>Se l'indirizzo è registrato, riceverai a breve un'email con il link per reimpostare la password.</p>
      <button type="button" class="btn btn-ghost" id="reset-inviato-back-btn" style="margin-top:14px;">Torna al login</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script>
  // Se già loggato, salta direttamente alla pagina giusta per il ruolo
  auth.onAuthStateChanged(async (user) => {
    if (!user) return;
    const profile = await getCurrentUserProfile();
    window.location.href = paginaIniziale(profile || { permessi: [] });
  });

  const form = document.getElementById("login-form");
  const errorMsg = document.getElementById("error-msg");
  const btn = document.getElementById("login-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMsg.textContent = "";
    btn.disabled = true;
    btn.textContent = "Accesso in corso…";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      await auth.signInWithEmailAndPassword(email, password);
      const profile = await getCurrentUserProfile();
      window.location.href = paginaIniziale(profile || { permessi: [] });
    } catch (err) {
      errorMsg.textContent = "Credenziali non valide. Riprova.";
      btn.disabled = false;
      btn.textContent = "Accedi";
    }
  });

  const loginForm = document.getElementById("login-form");
  const resetForm = document.getElementById("reset-form");
  const resetInviato = document.getElementById("reset-inviato");
  const resetError = document.getElementById("reset-error");
  const resetBtn = document.getElementById("reset-btn");

  function mostraLogin() {
    loginForm.classList.remove("hidden");
    resetForm.classList.add("hidden");
    resetInviato.classList.add("hidden");
  }

  document.getElementById("forgot-password-btn").addEventListener("click", () => {
    loginForm.classList.add("hidden");
    resetForm.classList.remove("hidden");
    document.getElementById("reset-email").value = document.getElementById("email").value.trim();
  });
  document.getElementById("reset-back-btn").addEventListener("click", mostraLogin);
  document.getElementById("reset-inviato-back-btn").addEventListener("click", mostraLogin);

  resetForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    resetError.textContent = "";
    resetBtn.disabled = true;
    resetBtn.textContent = "Invio…";

    const email = document.getElementById("reset-email").value.trim();
    try {
      const fn = cloudFunctions().httpsCallable("richiediResetPassword");
      await fn({ email });
      resetForm.classList.add("hidden");
      resetInviato.classList.remove("hidden");
    } catch (err) {
      resetError.textContent = "Errore: " + err.message;
    } finally {
      resetBtn.disabled = false;
      resetBtn.textContent = "Invia link di reset";
    }
  });
</script>
</body>
</html>
