<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stato partita — Tennis Club Mendrisio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script>if(localStorage.getItem("sportos-tema")==="light")document.documentElement.setAttribute("data-theme","light");</script>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest-cliente.json">
<meta name="theme-color" content="#0d1f30">
</head>
<body>
<div class="app">

  <div class="topbar">
    <div>
      <div class="topbar-kicker" id="centro-kicker">Tennis Club Mendrisio</div>
      <h1>Stato partita</h1>
    </div>
    <div></div>
    <div class="topbar-actions">
      <button type="button" class="topbar-link" id="theme-toggle-btn">Tema chiaro</button>
    </div>
  </div>

  <main>

    <div id="stato-caricamento" class="empty-state">
      <div class="display">Caricamento…</div>
    </div>

    <div id="stato-errore" class="empty-state hidden">
      <div class="display">Proposta non trovata</div>
      <p id="stato-errore-testo" style="color:var(--chalk-grey);"></p>
    </div>

    <div id="stato-content" class="hidden">
      <div class="gp-card" id="stato-riepilogo"></div>

      <div class="section-title"><h2>Confermati</h2></div>
      <div class="gp-card" id="stato-confermati"></div>

      <div class="section-title"><h2>In attesa</h2></div>
      <div class="gp-card" id="stato-in-attesa"></div>

      <p style="color:var(--chalk-grey);font-size:0.78rem;">Questa pagina si aggiorna da sola quando qualcuno risponde all'invito — puoi lasciarla aperta.</p>
    </div>

  </main>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/stato-partita.js"></script>
</body>
</html>
